name: Build Android APK

# Builds the debug APK on GitHub's servers — no Android Studio or SDK
# needed on your own machine. Runs automatically on every push, and can
# also be triggered manually from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: training-log-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
